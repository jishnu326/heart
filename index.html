html,body{margin:0;width:100%;height:100%;overflow:hidden;}
body{overscroll-behavior:none;}
body.waiting-for-music *{animation-play-state:paused !important;}
#musicStart{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.35);backdrop-filter:blur(2px);color:white;font-family:Arial,sans-serif;font-size:20px;font-weight:700;text-align:center;}
#musicStart span{padding:16px 24px;border:1px solid rgba(255,255,255,.5);border-radius:40px;background:rgba(0,0,0,.45);box-shadow:0 0 25px rgba(255,255,255,.2);}
.birthday-message{position:absolute;top:7vh;left:0;z-index:20;width:100%;text-align:center;pointer-events:none;font-family:Arial,Helvetica,sans-serif;font-weight:900;letter-spacing:2px;color:#9DEBFF;text-shadow:0 0 8px rgba(157,235,255,.95),0 0 20px rgba(90,210,255,.72),0 4px 12px rgba(0,0,0,.9)}
.birthday-line{margin:0;line-height:.95;opacity:0;position:relative;top:0;will-change:transform,top;}
.birthday-line.happy{font-size:clamp(48px,15vw,98px);transform:translateX(-120vw);animation:happyFromLeft 2.8s cubic-bezier(.25,.7,.25,1) 9s forwards,softWave 5.2s ease-in-out 12s infinite}
.birthday-line.bday{font-size:clamp(36px,11.5vw,76px);margin-top:14px;transform:translateX(120vw);animation:bdayFromRight 2.8s cubic-bezier(.25,.7,.25,1) 9.7s forwards,softWave 5.5s ease-in-out 12.7s infinite}
.birthday-line.gopu{font-size:clamp(50px,16vw,105px);margin-top:14px;transform:translateY(-120vh);animation:gopuFromTop 2.9s cubic-bezier(.25,.7,.25,1) 10.4s forwards,softWave 5s ease-in-out 13.4s infinite}
.birthday-icons{margin-top:18px;display:flex;justify-content:center;align-items:center;gap:22px;font-size:clamp(34px,10vw,58px);opacity:0;animation:iconsIn 1.5s ease-out 13.4s forwards}
.birthday-heart{color:#fff;font-family:Arial,sans-serif;text-shadow:0 0 12px #fff,0 0 28px rgba(210,240,255,.9);animation:gentleFloat 2.5s ease-in-out 3.7s infinite}
.birthday-fairy{filter:drop-shadow(0 0 9px rgba(220,245,255,.9));animation:gentleFloat 2.8s ease-in-out 3.8s infinite reverse}
@keyframes happyFromLeft{0%{opacity:0;transform:translateX(-120vw)}100%{opacity:1;transform:translateX(0)}}
@keyframes bdayFromRight{0%{opacity:0;transform:translateX(120vw)}100%{opacity:1;transform:translateX(0)}}
@keyframes gopuFromTop{0%{opacity:0;transform:translateY(-120vh)}100%{opacity:1;transform:translateY(0)}}
@keyframes iconsIn{0%{opacity:0;transform:translateY(12px)}100%{opacity:1;transform:translateY(0)}}
@keyframes gentleFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes softWave{0%,100%{top:0;transform:translateY(0) rotate(0deg)}25%{top:-2px;transform:translateY(-2px) rotate(-0.4deg)}50%{top:0;transform:translateY(1px) rotate(0.4deg)}75%{top:2px;transform:translateY(-1px) rotate(-0.25deg)}}
@media(max-height:700px){.birthday-message{top:4vh}}
</style>

  <section id="photoPage" class="photo-page" aria-label="Our memories">

    <button id="memoryPhotoButton" class="photo-frame" type="button" aria-label="Tap to see the next photo">

    </button>

    <div class="photo-decoration photo-decoration-bottom">🌸　💕　🌸</div>

    <p id="tapText">Tap the photo ❤️</p>

    <div id="loveMessage" aria-live="polite">
      <div>I LOVE YOU A LOT</div>
      <div class="love-emoji">🥹❤️</div>
    </div>
  </section>

  <script>
    const photoPage = document.getElementById("photoPage");
    const memoryPhotoButton = document.getElementById("memoryPhotoButton");
    const memoryPhoto = document.getElementById("memoryPhoto");
    const tapText = document.getElementById("tapText");
    const loveMessage = document.getElementById("loveMessage");
    const photoDecorations = document.querySelectorAll(".photo-decoration");

    const photos = [
      "./photo1.jpg",
      "./photo2.jpg",
      "./photo3.jpg",
      "./photo4.jpg",
      "./photo5.jpg",
      "./photo6.jpg"
    ];

    let currentPhoto = 0;
    let changing = false;

    // Move to the photo page only after the birthday animation really finishes.
    // The birthday-icons animation is the last part of the first page.
    const birthdayIcons = document.querySelector(".birthday-icons");

    let photoPageShown = false;

    function showPhotoPage() {
      if (photoPageShown) return;
      photoPageShown = true;
      setTimeout(() => {
        photoPage.classList.add("show");
      }, 1800);
    }

    birthdayIcons.addEventListener("animationend", (event) => {
      if (event.animationName === "iconsIn") {
        showPhotoPage();
      }
    });

    // Fallback for mobile browsers/cache states where animationend may not fire.
    setTimeout(showPhotoPage, 17500);

    memoryPhotoButton.addEventListener("click", () => {
      if (changing) return;

      // Show the next photo.
      if (currentPhoto < photos.length - 1) {
        changing = true;
        memoryPhotoButton.classList.add("photo-changing");

        setTimeout(() => {
          currentPhoto++;
          memoryPhoto.src = photos[currentPhoto];

          // Keep the animation smooth even if an image is still loading.
          memoryPhoto.onload = () => {
            memoryPhotoButton.classList.remove("photo-changing");
            changing = false;
          };

          // Fallback if the browser already has the image cached.
          if (memoryPhoto.complete) {
            memoryPhotoButton.classList.remove("photo-changing");
            changing = false;
          }
        }, 350);

      } else {
        // After the last photo, show the final message.
        memoryPhotoButton.style.display = "none";
        tapText.style.display = "none";

        photoDecorations.forEach((item) => {
          item.style.display = "none";
        });

        loveMessage.style.display = "block";
      }
    });
  </script>

  <script>
    const bgMusic = document.getElementById("bgMusic");
    const musicStart = document.getElementById("musicStart");

    async function startExperience() {
      try {
        await bgMusic.play();
        document.body.classList.remove("waiting-for-music", "not-loaded");
        musicStart.remove();
      } catch (error) {
        console.log("Audio could not start:", error);
      }
    }

    musicStart.addEventListener("click", startExperience);
    document.addEventListener("pointerdown", startExperience, { once: true });
    musicStart.addEventListener("touchstart", startExperience, { once: true });
  </script>
